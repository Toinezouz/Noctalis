# ---------------------------------------------------------------------------
# NOCTALIS — deploiement Render
#
# Un seul Web Service : le serveur Express sert a la fois le client compile,
# l'API et Socket.IO. Meme origine, donc aucun probleme de CORS.
#
# Aucun secret ici : le projet n'en utilise aucun.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: noctalis
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # `--include=dev` est indispensable : NODE_ENV vaut `production` ci-dessous,
    # et sans ce drapeau `npm ci` sauterait les devDependencies — donc esbuild,
    # TypeScript et Vite, qui sont precisement ce qui construit le projet.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    # Deploie seulement quand les verifications GitHub sont passees.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Origine publique du service : Render la renseigne lui-meme.
      - key: CLIENT_URL
        fromService:
          type: web
          name: noctalis
          property: host
      # Duree de survie d'une observation sans joueur connecte (15 minutes).
      - key: ROOM_TTL_MS
        value: "900000"
