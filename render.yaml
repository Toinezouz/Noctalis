# ---------------------------------------------------------------------------
# UMBRASTRA — Render deployment
#
# A single Web Service: the Express server serves the built client, the API
# and Socket.IO. Same origin, so no CORS trouble.
#
# No secret here: the project uses none.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: noctalis
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # `--include=dev` is essential: NODE_ENV is `production` below, and
    # without this flag `npm ci` would skip devDependencies — esbuild,
    # TypeScript and Vite, which are precisely what builds the project.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    # Deploys only once the GitHub checks have passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Public origin of the service: Render fills it in itself.
      - key: CLIENT_URL
        fromService:
          type: web
          name: noctalis
          property: host
      # How long a game survives with nobody connected (15 minutes).
      - key: ROOM_TTL_MS
        value: "900000"
