<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3efe6" />
    <meta
      name="description"
      content="NOCTALIS - jeu de deduction a deux joueurs, en ligne, libre et open source."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>NOCTALIS - Devine ta constellation avant lui</title>
    <script>
      /*
        Theme pose AVANT le premier rendu : sans cela, un joueur en mode sombre
        verrait un eclair blanc au chargement. Le script est volontairement
        minuscule et sans dependance ; React reprend ensuite la main
        (cf. client/src/lib/theme.ts).
      */
      (function () {
        try {
          var raw = window.localStorage.getItem('noctalis:prefs');
          var saved = raw ? JSON.parse(raw).theme : 'auto';
          var pref = saved === 'light' || saved === 'dark' ? saved : 'auto';
          var dark =
            pref === 'dark' ||
            (pref === 'auto' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0b1022' : '#f3efe6');
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
