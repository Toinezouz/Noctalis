<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05080f" />
    <meta
      name="description"
      content="UMBRASTRA - an online deduction game for 2 to 4 people. Free and open source."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Link preview (the card drawn by chat apps). The server replaces this
      block with absolute URLs and, for invite links, a dedicated card: see
      server/src/http/preview.ts. Keep both markers.
    -->
    <!-- preview:start -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UMBRASTRA" />
    <meta property="og:title" content="UMBRASTRA - Find your constellation before anyone else" />
    <meta
      property="og:description"
      content="You can see everyone's stars except your own. A free online deduction game for 2 to 4 people: no sign-up, no ads."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- preview:end -->
    <title>UMBRASTRA - Find your constellation before anyone else</title>
    <script>
      /*
        The chosen theme is set BEFORE the first paint: without it, someone
        who picked the light theme would see a dark flash while loading. The
        page starts dark (the default, see <html> above); only a saved
        'light' changes that. The script is tiny on purpose and has no
        dependency; React takes over afterwards (see client/src/lib/theme.ts).
      */
      (function () {
        try {
          // 'noctalis:prefs': the name of the game up to version 1.3.
          var raw =
            window.localStorage.getItem('umbrastra:prefs') ||
            window.localStorage.getItem('noctalis:prefs');
          if (raw && JSON.parse(raw).theme === 'light') {
            document.documentElement.dataset.theme = 'light';
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#eef2f8');
          }
        } catch (error) {
          // Storage unavailable: the page keeps the default theme.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
