<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2ecdf" />
    <meta
      name="description"
      content="NOCTALIS - an online deduction game for 2 to 4 people. Free and open source."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Link preview (the card drawn by chat apps). The server replaces this
      block with absolute URLs and, for invite links, a dedicated card: see
      server/src/http/preview.ts. Keep both markers.
    -->
    <!-- preview:start -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NOCTALIS" />
    <meta property="og:title" content="NOCTALIS - Find your constellation before anyone else" />
    <meta
      property="og:description"
      content="You can see everyone's stars except your own. A free online deduction game for 2 to 4 people: no sign-up, no ads."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- preview:end -->
    <title>NOCTALIS - Find your constellation before anyone else</title>
    <script>
      /*
        The theme is set BEFORE the first paint: without it, someone in dark
        mode would see a white flash while loading. The script is tiny on
        purpose and has no dependency; React takes over afterwards
        (see client/src/lib/theme.ts).
      */
      (function () {
        try {
          var raw = window.localStorage.getItem('noctalis:prefs');
          var saved = raw ? JSON.parse(raw).theme : 'auto';
          var pref = saved === 'light' || saved === 'dark' ? saved : 'auto';
          var dark =
            pref === 'dark' ||
            (pref === 'auto' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#070b1a' : '#f2ecdf');
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
