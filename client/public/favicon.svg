<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NOCTALIS">
  <!-- A disc of night sky -->
  <defs>
    <radialGradient id="sky" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#2c2f78" />
      <stop offset="100%" stop-color="#0b0f25" />
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#sky)" stroke="#d8a93f" stroke-width="2.4" />
  <!-- Constellation lines -->
  <path d="M17 41 L26 24 L39 32 L47 19 M26 24 L34 45"
        fill="none" stroke="#c9c2ff" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />
  <!-- The stars -->
  <g fill="#f4f2ff">
    <circle cx="17" cy="41" r="2.6" />
    <circle cx="39" cy="32" r="2.6" />
    <circle cx="47" cy="19" r="2.2" />
    <circle cx="34" cy="45" r="3" />
  </g>
  <!-- The brightest star -->
  <path d="M26 17.5 L27.1 22.9 L32.5 24 L27.1 25.1 L26 30.5 L24.9 25.1 L19.5 24 L24.9 22.9 Z"
        fill="#ecc86c" />
</svg>
